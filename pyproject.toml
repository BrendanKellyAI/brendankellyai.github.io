[project]
name = "brendankellyai-hub"
version = "0.1.0"
description = "Static site generator for the brendankellyai.github.io series hub"
readme = "README.md"
license = "MIT"
authors = [{ name = "Brendan Kelly" }]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=hub --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["hub"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
