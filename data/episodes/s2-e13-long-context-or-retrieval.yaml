summary: "Sending the whole 160,000-token library matched retrieval on accuracy, 75 against 71 hard questions, and was no slower, but cost ten times as much per question."
decision_rule: "Use long context when the documents fit and change rarely; use retrieval when the library outgrows the window, changes often, or must be scoped per user."
